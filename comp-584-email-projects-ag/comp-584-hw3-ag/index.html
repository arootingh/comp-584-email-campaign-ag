<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HW3 – Improved Email</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* Media query needed for responsive hero */
      @media (max-width: 640px) {
        .inner { width:100% !important; }
        .padded { padding-left:16px !important; padding-right:16px !important; }
        .cta { width:100% !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background:#e5e7eb;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e5e7eb;">
      <tr>
        <td align="center" style="padding:24px;">

          <table role="presentation" width="600" class="inner" cellpadding="0" cellspacing="0" border="0" style="width:600px;background:#ffffff;">
            <tr>
              <td style="padding:24px; text-align:center;" class="padded">
                <h1 style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:28px; color:#111827;">
                  Arootin Auto Care
                </h1>
              </td>
            </tr>

            <!-- Background image text area -->
            <tr>
              <td background="assets/hero.png" style="padding:48px 24px; background-size:cover; background-position:center; text-align:center;" class="padded" aria-label="Fall tune-up specials">
                <div style="display:inline-block; background:rgba(255,255,255,0.86); padding:16px 20px; font-family:Arial, Helvetica, sans-serif; color:#111827;">
                  <div style="font-size:22px; font-weight:bold;">Fall Tune-Up Specials</div>
                  <div style="font-size:14px; margin-top:6px;">Save on essentials all month</div>
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding:16px 24px;" class="padded">
                <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#374151;">
                  Book your service in minutes. Our single-column layout keeps things simple and readable
                  across devices (recommended inner width: <strong>600px</strong>).
                </p>
              </td>
            </tr>

            <!-- Centered button with generous hit area -->
            <tr>
              <td align="center" style="padding:16px 24px 32px;" class="padded">
                <!-- bulletproof button -->
                <a href="https://example.com/book" 
                   style="background:#111827;color:#ffffff;display:inline-block;text-decoration:none;
                          font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:1;
                          padding:16px 24px;border-radius:6px;margin:6px 0;"
                   class="cta" role="button" aria-label="Book appointment">
                  Book Appointment
                </a>
                <div style="height:10px; line-height:10px; font-size:10px;">&nbsp;</div>
                <a href="https://example.com/coupons" 
                   style="background:#2563eb;color:#ffffff;display:inline-block;text-decoration:none;
                          font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:1;
                          padding:16px 24px;border-radius:6px;margin:6px 0;"
                   class="cta" role="button" aria-label="View coupons">
                  View Coupons
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding:0 24px 24px;" class="padded">
                <img src="assets/hero.png" alt="Service bay with technicians" width="552" style="display:block; width:100%; height:auto; border:0;">
              </td>
            </tr>
          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
